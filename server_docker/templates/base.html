<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}WechatVideoDL{% endblock %}</title>
  <script>
    (() => {
      const saved = localStorage.getItem('wvd-theme') || 'system';
      document.documentElement.dataset.theme = saved;
    })();
  </script>
  <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body data-page="{% block page %}base{% endblock %}" data-base-path="{{ request.script_root }}">
  {% block shell %}
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="{{ url_for('index') }}" aria-label="WechatVideoDL 首页">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="WechatVideoDL Logo" class="brand-logo">
        <span class="brand-copy">
          <strong>WechatVideoDL</strong>
          <small>Video intelligence workspace</small>
        </span>
      </a>
      <nav class="header-actions" aria-label="主导航">
        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">工作台</a>
        <a class="nav-link {% if request.path.startswith('/history') %}active{% endif %}" href="{{ url_for('history_page') }}">历史记录</a>
        <label class="theme-control" aria-label="主题">
          <span>主题</span>
          <select id="theme-select">
            <option value="system">跟随系统</option>
            <option value="light">明亮</option>
            <option value="dark">暗色</option>
          </select>
        </label>
        {% if current_user() %}
        <a class="nav-link" href="{{ url_for('account_page') }}" title="我的账号与密码">账号</a>
        {% if current_user().role == 'admin' %}
        <a class="nav-link" href="{{ url_for('admin_users') }}" title="创建用户与管理权限">用户管理</a>
        {% endif %}
        <form method="post" action="{{ url_for('logout') }}" class="header-logout-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="nav-link muted-link header-logout">退出</button>
        </form>
        {% endif %}
      </nav>
    </header>
    <main class="app-main">{% block content %}{% endblock %}</main>
  </div>
  {% endblock %}
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
